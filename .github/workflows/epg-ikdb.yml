# IK Play — pre-built EPG ("ikdb").
# Italofull (github.com/itaalo67/epg, ~6000 channels / ~2M programmes) is turned into a SQLite file whose per-channel
# blobs are byte-identical to what the app's own EPG writer stores (checked 5964/5964 on a Dune box). The app then only
# ATTACHes it and copies rows (~2 s) instead of parsing 2 GB of XML (~50 s on Dune Pro 8K Plus, minutes on weak boxes).
name: EPG ikdb

on:
  schedule:
    # italo republishes full.xml.gz ~18:15 UTC but sometimes again in the evening (19-21 London) with sport fixes —
    # poll every 20 min; the first step only compares the asset's updated_at and skips in ~10 s when unchanged.
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if the source did not change'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: epg-ikdb
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: epg-ikdb
      SRC: https://github.com/itaalo67/epg/releases/download/daily/full.xml.gz
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: epg
      - name: Source changed?
        id: chk
        run: |
          set -e
          src=$(gh api repos/itaalo67/epg/releases/tags/daily --jq '.assets[] | select(.name=="full.xml.gz") | .updated_at')
          echo "source updated_at: $src"
          prev=$(gh release view "$TAG" --json body --jq .body 2>/dev/null | sed -n 's/^src_updated_at: //p' | head -1 || true)
          echo "last built from:  $prev"
          echo "src=$src" >> "$GITHUB_OUTPUT"
          if [ -n "$src" ] && [ "$src" = "$prev" ] && [ "${{ inputs.force }}" != "true" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.skip != '1'
        with:
          node-version: '20'
      - name: Install
        if: steps.chk.outputs.skip != '1'
        working-directory: epg
        run: npm install --no-audit --no-fund
      - name: Download italo
        if: steps.chk.outputs.skip != '1'
        run: curl -fsSL --retry 3 -o /tmp/italo.xml.gz "$SRC" && ls -la /tmp/italo.xml.gz
      - name: Build ikdb
        if: steps.chk.outputs.skip != '1'
        env:
          TZ: Asia/Tashkent
        # user: italo тўлиқ, ҳеч қандай филтрсиз (приставкадаги «Нет» каби) — вақт ойнаси ҳам йўқ (--keep=-1 --ahead=0)
        run: node --max-old-space-size=6144 epg/ikdb_gen.js /tmp/italo.xml.gz /tmp/italo.ikdb --keep=-1 --ahead=0 | tee /tmp/gen.log
      - name: Encrypt (IKE1)
        if: steps.chk.outputs.skip != '1'
        env:
          IKDB_MASTER: ${{ secrets.IKDB_MASTER }}
        # 2026-11-06 ikdb ҳимояси: файл шифрланади, калитни фақат сервер пуллик Premium қурилмага беради.
        # Секрет йўқ бўлса — қадам хато билан тўхтайди (шифрсиз файл ҲЕЧ ҚАЧОН юкланмайди).
        run: |
          set -e
          node epg/ikdb_enc.js enc /tmp/italo.ikdb /tmp/italo.enc
          mv /tmp/italo.enc /tmp/italo.ikdb
          head -c 4 /tmp/italo.ikdb | grep -q IKE1
      - name: Publish release asset
        if: steps.chk.outputs.skip != '1'
        run: |
          set -e
          stats=$(grep '^{' /tmp/gen.log | tail -1)
          built=$(date -u +%FT%TZ)
          src="${{ steps.chk.outputs.src }}"
          notes=$(printf 'Pre-built EPG for IK Play (format ikdb1, encrypted IKE1: the key is served only to IK Play Premium devices).\nsrc: %s\nsrc_updated_at: %s\nbuilt_at: %s\nstats: %s\n' "$SRC" "$src" "$built" "$stats")
          # ikdb_meta.json — app «IK Play DB» manbasida src_updated_at + built_at ko'rsatadi (release body'dan ko'ra barqaror parse; yo'q bo'lsa app jim)
          printf '{"src_updated_at":"%s","built_at":"%s","src":"%s","stats":%s}\n' "$src" "$built" "$SRC" "${stats:-null}" > /tmp/ikdb_meta.json
          cat /tmp/ikdb_meta.json
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/italo.ikdb /tmp/ikdb_meta.json --clobber
            gh release delete-asset "$TAG" italo.ikdb.gz -y 2>/dev/null || true
            gh release edit "$TAG" --notes "$notes"
          else
            gh release create "$TAG" /tmp/italo.ikdb /tmp/ikdb_meta.json --title "EPG ikdb (IK Play)" --notes "$notes" --latest=false
          fi
          # ikdb_meta.json ni repo FAYLi sifatida ham yozamiz: app JS raw.githubusercontent.com'dan oladi (release asset CDN objects.githubusercontent.com CORS bermaydi -> JS fetch bloklanadi).
          meta_sha=$(gh api "repos/${{ github.repository }}/contents/ikdb_meta.json" --jq .sha 2>/dev/null || true)
          gh api -X PUT "repos/${{ github.repository }}/contents/ikdb_meta.json" -f message="epg-ikdb: meta $built" -f content="$(base64 -w0 /tmp/ikdb_meta.json)" ${meta_sha:+-f sha="$meta_sha"} >/dev/null && echo "repo ikdb_meta.json updated"
          gh release view "$TAG" --json assets --jq '.assets[] | [.name, .size, .updatedAt] | @tsv'
